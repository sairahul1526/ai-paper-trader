# Copy this file to a private path and fill credentials through environment
# variables. This module is paper-only; it has no live-order integration.
# The command-line runner defaults to the example symbol below.
instrument:
  exchange: NSE
  trading_symbol: RELIANCE
  interval: 1m

history:
  one_minute_bars: 390
  five_minute_bars: 390
  daily_bars: 90

typesafe:
  model: jev-latest
  request_timeout: 8s
  max_retries: 1

risk:
  capital: 10000
  max_position_value_percent: 25
  max_daily_loss_percent: 1
  max_trades_per_day: 5
  stop_loss_percent: 1
  max_spread_percent: 0.15
  min_action_confidence: 0.60
  min_buy_support: 0.60
  allow_short: false
