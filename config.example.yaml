# Reference values for the paper runner. The current command accepts flags and
# environment variables; this file is intentionally credential-free.
market: us                    # india or us
exchange: NASDAQ              # India venue (NSE/BSE) or US venue label
symbol: AAPL                  # any supported cash-equity ticker
paper_only: true              # the only supported execution mode

history:
  one_minute_bars: 1000
  five_minute_bars: 500
  daily_bars: 180
  max_state_bytes: 32000

typesafe:
  model: jev-latest
  request_timeout: 8s
  max_retries: 1

risk:
  capital: 100000
  max_position_value_percent: 25
  max_daily_loss_percent: 1
  max_trades_per_day: 5
  stop_loss_percent: 1
  max_spread_percent: 0.15
  min_action_confidence: 0.60
  min_buy_support: 0.60
  allow_short: false

# India credentials: KITE_API_KEY, KITE_API_SECRET, KITE_ACCESS_TOKEN
# US credentials: ALPACA_API_KEY, ALPACA_API_SECRET
# Shared credential: TYPESAFE_API_KEY
